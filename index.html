<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WATCHER / cursor surveillance</title><meta name="theme-color" content="#c90022"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c90022;color:#090909;font-family:Arial,Helvetica,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}.hud{position:fixed;inset:0;pointer-events:none;text-transform:uppercase;font-size:9px;font-weight:700;letter-spacing:.17em}.mark{position:absolute;top:24px;left:24px;border:1px solid rgba(0,0,0,.55);padding:7px 9px;line-height:1}.status{position:absolute;top:28px;right:28px;text-align:right}.status i{display:inline-block;width:5px;height:5px;background:#090909;border-radius:50%;margin-right:6px;animation:pulse 1.2s infinite}.readout{position:absolute;bottom:26px;left:25px;line-height:1.8}.hint{position:absolute;right:28px;bottom:27px;text-align:right;opacity:.65}.reticle{position:fixed;width:34px;height:34px;margin:-17px;left:50%;top:50%;pointer-events:none;border:1px solid rgba(0,0,0,.62);border-radius:50%;transition:width .15s,height .15s,margin .15s}.reticle:before,.reticle:after{content:"";position:absolute;background:#090909}.reticle:before{height:1px;width:42px;left:-5px;top:16px}.reticle:after{width:1px;height:42px;left:16px;top:-5px}.reticle b{position:absolute;width:4px;height:4px;border-radius:50%;background:#090909;left:14px;top:14px}.grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;opacity:.075;animation:noise .22s steps(2) infinite;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.85'/%3E%3C/svg%3E")}@keyframes noise{0%{transform:translate(0)}25%{transform:translate(3%,-2%)}50%{transform:translate(-2%,3%)}75%{transform:translate(4%,2%)}}@keyframes pulse{50%{opacity:.2}}@media(max-width:600px){.hint{display:none}.status{top:25px;right:20px}.mark{left:20px}.readout{left:20px;bottom:20px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div class="hud"><div class="mark">SNTX / 09</div><div class="status"><i></i>visual lock</div><div class="readout">subject <span id="id">#0000</span><br>az <span id="az">+00.0</span> / el <span id="el">+00.0</span></div><div class="hint">move to evade<br>tap to disturb</div></div><div class="reticle"><b></b></div><div class="grain"></div><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xc90022);scene.fog=new THREE.FogExp2(0xc90022,.035);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(0,2.2,13.5);camera.lookAt(0,.6,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.8;document.body.prepend(renderer.domElement);
const env=new RoomEnvironment();scene.environment=new THREE.PMREMGenerator(renderer).fromScene(env).texture;
const black=new THREE.MeshStandardMaterial({color:0x080606,roughness:.7,metalness:.14});const skin=new THREE.MeshStandardMaterial({color:0x140909,roughness:.86,metalness:.02});const glass=new THREE.MeshPhysicalMaterial({color:0x090000,roughness:.12,metalness:.7,clearcoat:1});const redEye=new THREE.MeshBasicMaterial({color:0xff1738});
const rig=new THREE.Group();rig.position.y=.75;scene.add(rig);const bodyPivot=new THREE.Group();rig.add(bodyPivot);
function mesh(g,m=black){const o=new THREE.Mesh(g,m);o.castShadow=o.receiveShadow=true;return o}
// armored body: layered carapace, underside, sensor face
const body=mesh(new THREE.BoxGeometry(3.0,1.15,2.05,5,3,4),skin);body.geometry.attributes.position.array.forEach((v,i,a)=>{if(i%3===1)a[i]+=Math.sin(a[i-1]*2.4+a[i+1]*1.7)*.10});body.geometry.computeVertexNormals();body.position.y=1.35;body.rotation.x=-.04;bodyPivot.add(body);
for(let i=0;i<7;i++){const plate=mesh(new THREE.BoxGeometry(2.8-i*.05,.09,1.82-i*.025),black);plate.position.set(0,1.95+i*.017,.02+(i-3)*.04);plate.rotation.y=(i-3)*.013;bodyPivot.add(plate)}
for(let x of [-1.12,-.55,0,.55,1.12]){const ridge=mesh(new THREE.CapsuleGeometry(.045,.95,3,6),black);ridge.rotation.z=Math.PI/2;ridge.position.set(x,2.01,0);bodyPivot.add(ridge)}
const face=mesh(new THREE.BoxGeometry(2.65,.58,.25),black);face.position.set(0,1.27,1.05);face.rotation.x=-.11;bodyPivot.add(face);
for(let x of [-.72,0,.72]){const eye=mesh(new THREE.CylinderGeometry(.12,.15,.16,12),glass);eye.rotation.x=Math.PI/2;eye.position.set(x,1.29,1.23);bodyPivot.add(eye);const pupil=mesh(new THREE.CircleGeometry(.055,16),redEye);pupil.position.set(x,1.29,1.323);bodyPivot.add(pupil)}
for(let i=0;i<16;i++){const n=mesh(new THREE.CylinderGeometry(.035,.05,.13,7),black);const x=(i%8-3.5)*.32;n.rotation.x=Math.PI/2;n.position.set(x,1.72-(i>7?.22:0),1.14);bodyPivot.add(n)}
// articulated legs, each curve updated toward cursor and gait
const legs=[];function limb(side,index){const root=new THREE.Group();root.position.set(side*(1.18-index*.04),1.35,.62-index*.53);bodyPivot.add(root);const upper=new THREE.Group();root.add(upper);const a=mesh(new THREE.CapsuleGeometry(.105,.8,5,8),black);a.position.y=-.48;upper.add(a);const knee=new THREE.Group();knee.position.y=-.94;upper.add(knee);const joint=mesh(new THREE.SphereGeometry(.15,10,8),skin);knee.add(joint);const lower=mesh(new THREE.CapsuleGeometry(.075,1.35,4,7),black);lower.position.y=-.75;knee.add(lower);const ankle=new THREE.Group();ankle.position.y=-1.48;knee.add(ankle);const foot=mesh(new THREE.ConeGeometry(.055,.65,7),black);foot.position.y=-.28;foot.rotation.z=side*.13;ankle.add(foot);upper.rotation.z=side*(.32+.10*index);upper.rotation.x=(index-1.5)*.17;knee.rotation.z=side*(-.16-.07*index);legs.push({root,upper,knee,ankle,side,index,phase:index*1.4+(side<0?.8:0)});}
for(let s of [-1,1])for(let i=0;i<4;i++)limb(s,i);
// hanging cable and small tendons
const cableMat=new THREE.LineBasicMaterial({color:0x130307,transparent:true,opacity:.65});function cable(points,mat=cableMat){const c=new THREE.CatmullRomCurve3(points);const o=mesh(new THREE.TubeGeometry(c,32,.018,5,false),mat);scene.add(o);return o}cable([new THREE.Vector3(0,9,0),new THREE.Vector3(.03,5.4,.03),new THREE.Vector3(0,3.05,0)]);
for(let s of [-1,1])for(let i=0;i<4;i++){const x=s*(1.1+i*.04),z=.55-i*.5;cable([new THREE.Vector3(x,1.55,z),new THREE.Vector3(s*(1.8+i*.12),.1,z+.2),new THREE.Vector3(s*(2.1+i*.15),-1.7,z+.35)],new THREE.MeshStandardMaterial({color:0x170307,roughness:1}));}
// ground and lighting
const floor=mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0xc10020,roughness:.42,metalness:.03}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.95;scene.add(floor);
const key=new THREE.SpotLight(0xffd5cc,900,30,.55,.8,1);key.position.set(-4,8,7);key.target=body;key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key,key.target);const rim=new THREE.PointLight(0xff002d,380,15);rim.position.set(4,3,-3);scene.add(rim);const fill=new THREE.HemisphereLight(0xff3952,0x400008,1.2);scene.add(fill);
const pointer=new THREE.Vector2(), smooth=new THREE.Vector2(), target=new THREE.Vector3(), clock=new THREE.Clock();let disturb=0,last=performance.now();const ret=document.querySelector('.reticle');
function move(x,y){pointer.x=x/innerWidth*2-1;pointer.y=-(y/innerHeight*2-1);ret.style.left=x+'px';ret.style.top=y+'px';last=performance.now()}
addEventListener('pointermove',e=>move(e.clientX,e.clientY));addEventListener('pointerdown',e=>{move(e.clientX,e.clientY);disturb=1;ret.style.width='54px';ret.style.height='54px';ret.style.margin='-27px'});addEventListener('pointerup',()=>{ret.style.width='34px';ret.style.height='34px';ret.style.margin='-17px'});move(innerWidth/2,innerHeight/2);
const az=document.querySelector('#az'),el=document.querySelector('#el'),id=document.querySelector('#id');id.textContent='#'+Math.floor(1000+Math.random()*8999);
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.05);smooth.lerp(pointer,.055);const ray=new THREE.Raycaster();ray.setFromCamera(smooth,camera);ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,0,1),0),target);const yaw=THREE.MathUtils.clamp(-Math.atan2(target.x,12),-.5,.5);const pitch=THREE.MathUtils.clamp(pointer.y*.18,-.2,.2);bodyPivot.rotation.y+=(yaw-bodyPivot.rotation.y)*.09;bodyPivot.rotation.x+=(pitch-bodyPivot.rotation.x)*.08;rig.position.y=.75+Math.sin(t*.78)*.075+Math.sin(t*2.1)*.015;disturb*=.94;rig.rotation.z=Math.sin(t*.55)*.015+Math.sin(t*16)*disturb*.035;
legs.forEach(l=>{const gait=Math.sin(t*.9+l.phase)*.035+Math.sin(t*10+l.phase)*disturb*.08;l.upper.rotation.x=(l.index-1.5)*.17+gait;l.knee.rotation.z=l.side*(-.16-.07*l.index)+gait*l.side*.7;l.ankle.rotation.z=Math.sin(t*1.3+l.phase)*.035;});
const idle=(performance.now()-last)>2200;if(idle){pointer.x=Math.sin(t*.42)*.52;pointer.y=Math.sin(t*.29)*.24}az.textContent=(smooth.x>=0?'+':'')+(smooth.x*26).toFixed(1);el.textContent=(smooth.y>=0?'+':'')+(smooth.y*18).toFixed(1);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
